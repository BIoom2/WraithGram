# Builds an IPA to re-sign on the device (build-system/WGBuildResign.sh) on a GitHub-hosted Mac.
#
# Run it in your own fork: Actions тЖТ "Build IPA for re-signing" тЖТ Run workflow. The IPA is uploaded as
# a workflow artifact (kept for a few days), never as a release. See docs/ios/building.md.
#
# Your keys: repository secrets TELEGRAM_API_ID and TELEGRAM_API_HASH (from https://my.telegram.org).
# This fork requires personal API credentials and encrypts artifacts to its local age recipient.
#
# Telegram is a large build and the standard runner is small (3 cores, 7 GB of memory): a test run on
# xcode-27 took about 1 hour 20 minutes. The job stops after 6 hours.

name: Build IPA for re-signing

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Your bundle ID (not ph.telegra.Telegraph), e.g. com.yourname.wraithgram"
        required: true
      build_number:
        description: "Build number"
        required: true
        default: "1"
      runner:
        description: "Runner label; it must have the Xcode version from versions.json"
        required: true
        default: "xcode-27"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare artifact encryption
        env:
          ARTIFACT_RECIPIENT: ${{ vars.WG_ARTIFACT_RECIPIENT }}
        run: |
          test -n "$ARTIFACT_RECIPIENT" || { echo "::error::WG_ARTIFACT_RECIPIENT is missing"; exit 1; }
          command -v age >/dev/null || brew install age
          printf '' | age --encrypt --recipient "$ARTIFACT_RECIPIENT" >/dev/null

      - name: Select the Xcode from versions.json
        run: |
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "::error::$XCODE_PATH is not on this runner. Installed: $(echo /Applications/Xcode_*.app)"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          # Some third-party build files name /Applications/Xcode.app; on the runner it is a symlink to the
          # default Xcode, which the next step removes.
          if [ -L /Applications/Xcode.app ] || [ ! -e /Applications/Xcode.app ]; then
            sudo ln -sfn "$XCODE_PATH" /Applications/Xcode.app
          fi
          echo "XCODE_PATH=$XCODE_PATH" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Free disk space
        run: |
          df -h /
          for xcode in /Applications/Xcode_*.app; do
            [ "$(cd "$xcode" && pwd -P)" = "$(cd "$XCODE_PATH" && pwd -P)" ] || sudo rm -rf "$xcode"
          done
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/dotnet "$HOME/.dotnet" "$HOME/hostedtoolcache" || true
          df -h /

      - name: Write the configuration
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open("build-system/wraithgram-configuration.example.json"))
          config.pop("_warning", None)
          api_id = os.environ.get("API_ID", "").strip()
          api_hash = os.environ.get("API_HASH", "").strip()
          if not api_id.isdecimal() or api_id == "8" or len(api_hash) != 32 or any(c not in "0123456789abcdefABCDEF" for c in api_hash):
              raise SystemExit("::error::Set valid personal TELEGRAM_API_ID and TELEGRAM_API_HASH secrets.")
          config["api_id"] = api_id
          config["api_hash"] = api_hash
          config["bundle_id"] = os.environ["BUNDLE_ID"].strip()
          json.dump(config, open("build-system/wraithgram-configuration.json", "w"), indent=2)
          PY

      - name: Build
        env:
          WG_BAZEL_CACHE: ""
          WG_BUILD_LOG: ${{ runner.temp }}/wg-build.log
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: build-system/WGBuildResign.sh "$BUILD_NUMBER"

      - name: Encrypt the IPA
        env:
          ARTIFACT_RECIPIENT: ${{ vars.WG_ARTIFACT_RECIPIENT }}
        run: |
          age --encrypt --recipient "$ARTIFACT_RECIPIENT" \
            --output "$RUNNER_TEMP/WraithGram.ipa.age" \
            build-output/ipa/Wraithgram-for-resign.ipa

      - name: Upload the encrypted IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wraithgram-for-resign-${{ inputs.build_number }}
          path: ${{ runner.temp }}/WraithGram.ipa.age
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Encrypt the build log
        if: failure()
        env:
          ARTIFACT_RECIPIENT: ${{ vars.WG_ARTIFACT_RECIPIENT }}
        run: |
          if [ -f "$RUNNER_TEMP/wg-build.log" ]; then
            age --encrypt --recipient "$ARTIFACT_RECIPIENT" \
              --output "$RUNNER_TEMP/wg-build.log.age" "$RUNNER_TEMP/wg-build.log"
          fi

      - name: Upload the encrypted build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/wg-build.log.age
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
